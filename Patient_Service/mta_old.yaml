_schema-version: "3.3.0"

ID: Patient_Service
version: 1.0.0
description: Patient Service

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:

  ###############################################################################
  # CAP SERVICE
  ###############################################################################

  - name: Patient_Service-srv
    type: nodejs
    path: gen/srv

    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 512M

    build-parameters:
      builder: npm-ci

    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

    requires:
      - name: Patient_Service-db
      - name: Patient_Service-auth

  ###############################################################################
  # HANA DEPLOYER
  ###############################################################################

  - name: Patient_Service-db-deployer
    type: hdb
    path: gen/db

    parameters:
      buildpack: nodejs_buildpack

    requires:
      - name: Patient_Service-db

  ###############################################################################
  # UI MODULE
  ###############################################################################

  - name: patient-ui
    type: html5
    path: app/patient-ui

    build-parameters:
      builder: custom
      build-result: dist

      commands:
        - npm install
        - npm run build:cf
        - npm ci
        - npm run build

      supported-platforms:
        []

  ###############################################################################
  # HTML5 APP CONTENT
  ###############################################################################

  - name: patient-ui-app-content
    type: com.sap.application.content
    path: .

    requires:
      - name: Patient_Service-html5-repo
        parameters:
          content-target: true

    build-parameters:
      build-result: resources

      requires:
        - name: patient-ui
          artifacts:
            - patient-ui.zip
          target-path: resources/

  ###############################################################################
  # DESTINATION CONTENT
  ###############################################################################

  - name: patient-ui-destination-content
    type: com.sap.application.content

    build-parameters:
      no-source: true

    requires:
      - name: Patient_Service-destination
        parameters:
          content-target: true

      - name: Patient_Service-html5-repo
        parameters:
          service-key:
            name: Patient_Service-html5-key

      - name: Patient_Service-auth
        parameters:
          service-key:
            name: Patient_Service-auth-key

    parameters:
      content:
        instance:
          existing_destinations_policy: update

          destinations:

            - Name: Patient_Service_html_repo_host
              ServiceInstanceName: Patient_Service-html5-repo
              ServiceKeyName: Patient_Service-html5-key
              sap.cloud.service: hospitalpatientpatientui

            - Name: Patient_Service_uaa
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: Patient_Service-auth
              ServiceKeyName: Patient_Service-auth-key
              sap.cloud.service: hospitalpatientpatientui

  - name: Patient_Service-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: Patient_Servicepatientui
          artifacts:
            - patient-ui.zip
          target-path: app/
        - name: patient-ui
    requires:
      - name: Patient_Service-auth
      - name: srv-api
      - name: Patient_Service-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
      - name: Patient_Service-html5-repo

  - name: Patient_Service
    type: approuter.nodejs
    path: app/router
    requires:
      - name: Patient_Service-html5-runtime
      - name: Patient_Service-auth
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

###############################################################################
# RESOURCES
###############################################################################

resources:

  - name: Patient_Service-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: Patient_Service-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: xs-security.json
      config:
        xsappname: Patient_Service-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api

  - name: Patient_Service-html5-repo
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: Patient_Service-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

      config:
        HTML5Runtime_enabled: true

        init_data:
          instance:
            existing_destinations_policy: update

            destinations:

              - Name: ui5
                Type: HTTP
                ProxyType: Internet
                Authentication: NoAuthentication
                URL: https://ui5.sap.com

              - Name: patient-service-srv
                Type: HTTP
                ProxyType: Internet
                Authentication: OAuth2UserTokenExchange
                URL: ~{srv-api/srv-url}

                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                sap.cloud.service: hospitalpatientpatientui

    requires:
      - name: srv-api
  - name: Patient_Service-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
