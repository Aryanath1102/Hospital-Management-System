_schema-version: 3.3.0

ID: Doctor_Service
version: 1.0.0
description: "A simple CAP project."

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:

  # =========================================================
  # CAP SERVICE
  # =========================================================

  - name: Doctor_Service-srv
    type: nodejs
    path: gen/srv

    parameters:
      instances: 1
      buildpack: nodejs_buildpack

    build-parameters:
      builder: npm-ci

    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

    requires:
      - name: Doctor_Service-db
      - name: Doctor_Service-auth
      - name: Doctor_Service-destination


  # =========================================================
  # HANA DB DEPLOYER
  # =========================================================

  - name: Doctor_Service-db-deployer
    type: hdb
    path: gen/db

    parameters:
      buildpack: nodejs_buildpack

    requires:
      - name: Doctor_Service-db


  # =========================================================
  # FIORI HTML5 APPLICATION
  # =========================================================

  - name: doctorui
    type: html5
    path: app/doctorui

    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      build-result: dist
      supported-platforms: []


# =========================================================
# FIORI APP CONTENT → HTML5 REPOSITORY
# =========================================================

  - name: Doctor_Service-app-content
    type: com.sap.application.content
    path: .

    requires:
      - name: Doctor_Service-repo-host
        parameters:
          content-target: true

    build-parameters:
      build-result: resources

      requires:
        - name: doctorui
          artifacts:
            - doctorui.zip
          target-path: resources/
      build-parameters:
        build-result: resources


  # =========================================================
  # APPLICATION ROUTER
  # =========================================================

  - name: Doctor_Service
    type: approuter.nodejs
    path: app/router

    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M

    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

      - name: Doctor_Service-auth

      - name: Doctor_Service-html5-runtime

      - name: Doctor_Service-destination

    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}


# =========================================================
# RESOURCES
# =========================================================

resources:

  # =========================================================
  # HANA
  # =========================================================

  - name: Doctor_Service-db
    type: com.sap.xs.hdi-container

    parameters:
      service: hana
      service-plan: hdi-shared


  # =========================================================
  # XSUAA
  # =========================================================

  - name: Doctor_Service-auth
    type: org.cloudfoundry.managed-service

    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

      config:
        xsappname: Doctor_Service-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          redirect-uris:
            - https://*~{app-api/app-uri}/**

    requires:
      - name: app-api


  # =========================================================
  # DESTINATION SERVICE
  # =========================================================

  - name: Doctor_Service-destination
    type: org.cloudfoundry.managed-service

    parameters:
      service: destination
      service-plan: lite

      config:
        HTML5Runtime_enabled: true

        init_data:
          instance:
            existing_destinations_policy: update

            destinations:

              # CAP BACKEND DESTINATION
              - Name: Doctor_Service-srv
                URL: ~{srv-api/srv-url}
                Type: HTTP
                ProxyType: Internet
                Authentication: NoAuthentication
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true

              # SAPUI5 CDN
              - Name: ui5
                URL: https://ui5.sap.com
                Type: HTTP
                ProxyType: Internet
                Authentication: NoAuthentication

    requires:
      - name: srv-api
        group: destinations
        properties:
          name: Doctor_Service-srv
          url: ~{srv-url}
          forwardAuthToken: true


  # =========================================================
  # HTML5 APPLICATION REPOSITORY - HOST
  # =========================================================

  - name: Doctor_Service-repo-host
    type: org.cloudfoundry.managed-service

    parameters:
      service: html5-apps-repo
      service-plan: app-host
      service-name: Doctor_Service-html5-service


  # =========================================================
  # HTML5 APPLICATION REPOSITORY - RUNTIME
  # =========================================================

  - name: Doctor_Service-html5-runtime
    type: org.cloudfoundry.managed-service

    parameters:
      service: html5-apps-repo
      service-plan: app-runtime